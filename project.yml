name: GymTracker
options:
  bundleIdPrefix: com.joaobarreira
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"

targets:
  GymTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GymTracker
    settings:
      base:
        PRODUCT_NAME: GymTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.joaobarreira.GymTracker
        INFOPLIST_FILE: GymTracker/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OPTIMIZATION_LEVEL: "-O"
